appId: io.qzz.qqx.note.desktop
productName: Notepad
executableName: notepad
electronVersion: "35.7.5"
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraMetadata:
  name: notepad
  main: dist-electron/main.cjs
protocols:
  - name: Notepad Auth
    schemes:
      - notepad
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Notepad
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
linux:
  icon: build/icon.png
  executableName: notepad
  category: Utility
  target:
    - AppImage
appImage:
  artifactName: "${productName}-${version}.${ext}"
